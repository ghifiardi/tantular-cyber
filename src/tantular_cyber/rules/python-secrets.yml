# Tantular Cyber local ruleset — hard-coded credentials (CWE-798).
#
# Supported: string literals (>= 8 chars) assigned to credential-like names, passed as
# password=/secret=/token=/api_key= keyword arguments, or assigned to Flask's
# app.secret_key / app.config["SECRET_KEY"] (cf. CVE-2022-25510); AWS access key ids.
# Values are redacted in all reports; the finding points at the line, not the value.
# Not covered: credentials inside dict/list literals, values split across concatenation,
# encoded values, non-Python config files (YAML/.env are excluded from scanning anyway).
rules:
  - id: tantular.python.secrets.hardcoded-credential
    languages: [python]
    severity: WARNING
    message: >-
      A credential-like value appears to be hard-coded in source. Anyone with read access to
      the code (or its history) can use it. Load it from the environment or a secret store
      and rotate the exposed value.
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://nvd.nist.gov/vuln/detail/CVE-2022-25510
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $NAME = "$V"
              - pattern: $OBJ.$NAME = "$V"
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^[a-z0-9_]*(password|passwd|pwd|secret|api_?key|access_?key|private_?key|auth_?token|token)[a-z0-9_]*$
          - metavariable-regex:
              metavariable: $V
              regex: ^.{8,}$
      - patterns:
          - pattern: $F(..., $KW="$V", ...)
          - metavariable-regex:
              metavariable: $KW
              regex: (?i)^(password|passwd|pwd|secret|secret_key|api_key|token|access_key)$
          - metavariable-regex:
              metavariable: $V
              regex: ^.{8,}$
      - patterns:
          - pattern: $APP.config["SECRET_KEY"] = "$V"
      - pattern-regex: \b(AKIA|ASIA)[0-9A-Z]{16}\b
