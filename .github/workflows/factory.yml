# Drop this file into each PRODUCT repo at .github/workflows/factory.yml
# It is the only per-repo change needed — all behaviour lives in the central
# factory repo, so every repo gets improvements automatically.
#
# Required repo secrets: FACTORY_TOKEN, FACTORY_LOG_KEY (set by scripts/bootstrap.sh), plus the credential for
# factory.yaml → inference.provider: CLAUDE_CODE_OAUTH_TOKEN | GATEWAY_KEY | ANTHROPIC_API_KEY
# The factory repo must be PUBLIC: a public product repo can't call workflows in a private one.
name: software-factory

on:
  issues:
    types: [opened, labeled]

jobs:
  triage:
    if: github.event.action == 'opened'
    permissions:
      contents: read
      issues: write
    uses: ghifiardi/software-factory/.github/workflows/factory-triage.yml@main
    with:
      factory_repo: ghifiardi/software-factory
      data_repo: ghifiardi/software-factory-data
    secrets:   # pass only what the factory needs — not `inherit`, which hands over every repo secret
      # Only the credential that factory.yaml → inference.provider names is used.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
      FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
      FACTORY_LOG_KEY: ${{ secrets.FACTORY_LOG_KEY }}

  implement:
    if: github.event.action == 'labeled' && github.event.label.name == 'factory:implement'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ghifiardi/software-factory/.github/workflows/factory-implement.yml@main
    with:
      factory_repo: ghifiardi/software-factory
      data_repo: ghifiardi/software-factory-data
    secrets:   # pass only what the factory needs — not `inherit`, which hands over every repo secret
      # Only the credential that factory.yaml → inference.provider names is used.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
      FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
      FACTORY_LOG_KEY: ${{ secrets.FACTORY_LOG_KEY }}
