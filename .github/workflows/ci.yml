name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev + semgrep extras; no Ollama in CI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,semgrep]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (live Ollama smoke test is skipped)
        run: pytest -q
      - name: Benchmark (offline, deterministic gates; no Ollama)
        run: tantular-cyber benchmark --corpus benchmarks/corpus --output out/benchmark-ci
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python-version }}
          path: out/benchmark-ci/
          if-no-files-found: ignore

  package:
    # Build the wheel from hash-locked tooling (twice, must be identical), audit licenses,
    # then install it into fresh venvs with and without a user-installed Semgrep and scan
    # the bundled sample from outside the source tree (Linux: inside a no-network namespace).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build twice from locked tooling; artifacts must be identical
        run: |
          python -m pip install --require-hashes -r requirements/build.lock.txt
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build --no-isolation --outdir dist .
          python -m build --no-isolation --outdir rebuild .
          (cd dist && shasum -a 256 -- *) > first.txt
          (cd rebuild && shasum -a 256 -- *) > second.txt
          diff first.txt second.txt && cat first.txt
      - name: License audit and SBOM
        run: |
          python -m venv rt
          rt/bin/python -m pip install --require-hashes -r requirements/runtime.lock.txt
          rt/bin/python tools/release/license_audit.py requirements/runtime.lock.txt
          rt/bin/python tools/release/sbom.py --wheel dist/*.whl \
            --lock requirements/runtime.lock.txt --output sbom.cdx.json
      - name: Fresh install without Semgrep (explicit PARTIAL / degraded)
        env:
          PYTHON: python
          NO_NETWORK: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bash tools/release/smoke.sh dist/*.whl requirements/runtime.lock.txt none
      - name: Fresh install with user-installed Semgrep (full / complete, benchmark gates)
        env:
          PYTHON: python
          NO_NETWORK: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bash tools/release/smoke.sh dist/*.whl requirements/runtime.lock.txt semgrep
