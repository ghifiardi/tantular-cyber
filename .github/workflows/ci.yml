name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev + semgrep extras; no Ollama in CI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,semgrep]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (live Ollama smoke test is skipped)
        run: pytest -q
